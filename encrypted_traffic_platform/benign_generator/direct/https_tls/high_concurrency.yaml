name: direct_high_concurrency
description: Matched Controlled Direct workload for high_concurrency
lifecycle:
  prepare:
  - type: command
    name: clear_direct_fullpath_netem
    command:
    - bash
    - -lc
    - /home/etip/bin/direct-fullpath-netem clear || true
    timeout: 30
  - type: command
    name: clear_direct_uplink_netem
    command:
    - bash
    - -lc
    - sudo -n /usr/local/sbin/etip-direct-netem clear || true
    timeout: 15
  - type: sleep
    name: pre_client_settle
    seconds: 1
  deploy: []
  execute:
  - type: command
    name: high_concurrency_downloads
    command:
    - bash
    - -lc
    - set -Eeuo pipefail; pids=(); for i in 1 2 3 4; do env -u http_proxy -u https_proxy
      -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY curl --noproxy '*' --resolve
      etip-server.lab:18443:192.168.100.20 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error --limit-rate 4M https://etip-server.lab:18443/files/file_10m.bin
      -o /tmp/direct_high_concurrency_${i}.bin & pids+=($!); done; status=0; for pid
      in "${pids[@]}"; do wait "${pid}" || status=1; done; exit "${status}"
    timeout: 90
  - type: sleep
    name: high_concurrency_post_idle
    seconds: 2
  finalize:
  - type: marker
    name: finalize_direct_profile
protocol: direct_https_tls
tool: curl
