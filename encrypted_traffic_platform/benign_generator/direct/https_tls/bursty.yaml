name: direct_bursty
description: Matched Controlled Direct workload for bursty
lifecycle:
  prepare:
  - type: command
    name: clear_direct_fullpath_netem
    command:
    - bash
    - -lc
    - /home/etip/bin/direct-fullpath-netem clear || true
    timeout: 30
  - type: command
    name: clear_direct_uplink_netem
    command:
    - bash
    - -lc
    - sudo -n /usr/local/sbin/etip-direct-netem clear || true
    timeout: 15
  - type: sleep
    name: pre_client_settle
    seconds: 1
  deploy: []
  execute:
  - type: command
    name: bursty_sequence
    command:
    - bash
    - -lc
    - set -Eeuo pipefail; for i in $(seq 1 10); do if (( i % 2 == 0 )); then env -u
      http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY
      curl --noproxy '*' --resolve etip-server.lab:18443:192.168.100.20 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error https://etip-server.lab:18443/cloud/index.json
      -o /tmp/direct_bursty_${i}.json; else env -u http_proxy -u https_proxy -u HTTP_PROXY
      -u HTTPS_PROXY -u all_proxy -u ALL_PROXY curl --noproxy '*' --resolve etip-server.lab:18443:192.168.100.20
      --cacert encrypted_traffic_platform/config/certs/etip-ca.crt --http1.1 --fail
      --silent --show-error --range 0-1048575 https://etip-server.lab:18443/files/file_10m.bin
      -o /tmp/direct_bursty_${i}.bin; fi; case $((i % 4)) in 0) sleep 0 ;; 1) sleep
      1 ;; 2) sleep 3 ;; 3) sleep 5 ;; esac; done
    timeout: 120
  - type: sleep
    name: bursty_post_idle
    seconds: 2
  finalize:
  - type: marker
    name: finalize_direct_profile
protocol: direct_https_tls
tool: curl
