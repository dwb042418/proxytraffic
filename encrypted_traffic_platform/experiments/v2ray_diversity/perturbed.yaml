  idle_interval: 3
  expected_connection_count: 4
  client_restart_mode: per_sample
  network_delay_ms: 40
  network_jitter_ms: 10
  packet_loss_rate: 0.2
  bandwidth_limit: 8mbit
  perturbation_direction: collector_egress_only
  perturbation_profile: netem_40ms_10ms_0.2pct_8mbit
