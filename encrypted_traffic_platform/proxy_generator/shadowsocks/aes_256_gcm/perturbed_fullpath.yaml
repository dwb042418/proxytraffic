name: shadowsocks_perturbed_fullpath
description: Shadowsocks AES-256-GCM workload under targeted bidirectional network
  perturbation
lifecycle:
  prepare:
  - type: command
    name: clear_shadowsocks_fullpath_netem
    command:
    - bash
    - -lc
    - /home/etip/bin/shadowsocks-fullpath-netem clear || true
    timeout: 30
  - type: command
    name: stop_existing_shadowsocks_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/shadowsocks/stop_client.sh || true
    timeout: 30
  - type: sleep
    name: pre_client_settle
    seconds: 1
  deploy:
  - type: command
    name: start_shadowsocks_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/shadowsocks/start_client.sh
    timeout: 30
  - type: sleep
    name: wait_for_socks_listener
    seconds: 2
  - type: command
    name: verify_local_socks_listener
    command:
    - bash
    - -lc
    - ss -lnt | grep -q '127.0.0.1:11081'
    timeout: 10
  execute:
  - type: command
    name: apply_shadowsocks_fullpath_netem
    command:
    - bash
    - -lc
    - /home/etip/bin/shadowsocks-fullpath-netem apply
    timeout: 30
  - type: command
    name: perturbed_web
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u
      ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11081 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error https://etip-server.lab:18443/web/ -o
      /tmp/shadowsocks_perturbed_web.html
    timeout: 40
  - type: command
    name: perturbed_download_10m
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u
      ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11081 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error --limit-rate 1M https://etip-server.lab:18443/files/file_10m.bin
      -o /tmp/shadowsocks_perturbed_10m.bin
    timeout: 90
  - type: command
    name: perturbed_download_50m
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u
      ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11081 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error --limit-rate 2M https://etip-server.lab:18443/files/file_50m.bin
      -o /tmp/shadowsocks_perturbed_50m.bin
    timeout: 150
  - type: command
    name: perturbed_api
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u
      ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11081 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error https://etip-server.lab:18443/cloud/index.json
      -o /tmp/shadowsocks_perturbed_api.json
    timeout: 40
  - type: sleep
    name: perturbed_post_idle
    seconds: 3
  finalize:
  - type: command
    name: clear_shadowsocks_fullpath_netem
    command:
    - bash
    - -lc
    - /home/etip/bin/shadowsocks-fullpath-netem clear || true
    timeout: 20
  - type: command
    name: stop_shadowsocks_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/shadowsocks/stop_client.sh || true
    timeout: 30
  - type: marker
    name: finalize_shadowsocks_profile
