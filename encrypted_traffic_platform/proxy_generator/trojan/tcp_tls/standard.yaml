name: trojan_standard
description: Mixed baseline workload over Trojan TCP TLS
lifecycle:
  prepare:
  - type: command
    name: stop_existing_trojan_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/trojan/stop_client.sh || true
    timeout: 30
  - type: sleep
    name: pre_client_settle
    seconds: 1
  deploy:
  - type: command
    name: start_trojan_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/trojan/start_client.sh
    timeout: 30
  - type: sleep
    name: wait_for_socks_listener
    seconds: 2
  - type: command
    name: verify_local_socks_listener
    command:
    - bash
    - -lc
    - ss -lnt | grep -q '127.0.0.1:11082'
    timeout: 10
  execute:
  - type: command
    name: standard_web
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u
      ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11082 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error https://etip-server.lab:18443/web/ -o
      /tmp/trojan_standard_web.html
    timeout: 30
  - type: command
    name: standard_download_10m
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u
      ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11082 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error --limit-rate 1M https://etip-server.lab:18443/files/file_10m.bin
      -o /tmp/trojan_standard_10m.bin
    timeout: 60
  - type: command
    name: standard_download_50m
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u
      ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11082 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error --limit-rate 2M https://etip-server.lab:18443/files/file_50m.bin
      -o /tmp/trojan_standard_50m.bin
    timeout: 120
  - type: command
    name: standard_api
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u
      ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11082 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error https://etip-server.lab:18443/cloud/index.json
      -o /tmp/trojan_standard_api.json
    timeout: 30
  - type: sleep
    name: standard_post_idle
    seconds: 3
  finalize:
  - type: command
    name: stop_trojan_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/trojan/stop_client.sh || true
    timeout: 30
  - type: marker
    name: finalize_trojan_profile
