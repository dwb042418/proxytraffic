name: trojan_bursty
description: Ten short transfers with variable idle gaps
lifecycle:
  prepare:
  - type: command
    name: clear_trojan_fullpath_netem
    command:
    - bash
    - -lc
    - /home/etip/bin/trojan-fullpath-netem clear || true
    timeout: 30
  - type: command
    name: stop_existing_trojan_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/trojan/stop_client.sh || true
    timeout: 30
  - type: sleep
    name: pre_client_settle
    seconds: 1
  deploy:
  - type: command
    name: start_trojan_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/trojan/start_client.sh
    timeout: 30
  - type: sleep
    name: wait_for_socks_listener
    seconds: 2
  - type: command
    name: verify_local_socks_listener
    command:
    - bash
    - -lc
    - ss -lnt | grep -q '127.0.0.1:11082'
    timeout: 10
  execute:
  - type: command
    name: bursty_sequence
    command:
    - bash
    - -lc
    - set -Eeuo pipefail; for i in $(seq 1 10); do if (( i % 2 == 0 )); then env -u
      http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY
      curl --noproxy '' --proxy socks5h://127.0.0.1:11082 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error https://etip-server.lab:18443/cloud/index.json
      -o /tmp/trojan_bursty_${i}.json; else env -u http_proxy -u https_proxy
      -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY curl --noproxy '' --proxy
      socks5h://127.0.0.1:11082 --cacert encrypted_traffic_platform/config/certs/etip-ca.crt
      --http1.1 --fail --silent --show-error --range 0-1048575 https://etip-server.lab:18443/files/file_10m.bin
      -o /tmp/trojan_bursty_${i}.bin; fi; case $((i % 4)) in 0) sleep 0 ;; 1)
      sleep 1 ;; 2) sleep 3 ;; 3) sleep 5 ;; esac; done
    timeout: 120
  - type: sleep
    name: bursty_post_idle
    seconds: 2
  finalize:
  - type: command
    name: stop_trojan_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/trojan/stop_client.sh || true
    timeout: 30
  - type: marker
    name: finalize_trojan_profile
