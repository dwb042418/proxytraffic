name: v2ray_perturbed
description: Baseline workload under targeted egress netem
lifecycle:
  prepare:
  - type: command
    name: clear_stale_netem
    command:
    - bash
    - -lc
    - sudo -n /usr/local/sbin/etip-v2ray-netem clear
    timeout: 15
  - type: command
    name: stop_existing_xray_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/xray/stop_client.sh || true
    timeout: 30
  - type: sleep
    name: pre_client_settle
    seconds: 1
  deploy:
  - type: command
    name: start_xray_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/xray/start_client.sh
    timeout: 30
  - type: sleep
    name: wait_for_socks_listener
    seconds: 2
  - type: command
    name: verify_local_socks_listener
    command:
    - bash
    - -lc
    - ss -lnt | grep -q '127.0.0.1:11080'
    timeout: 10
  execute:
  - type: command
    name: apply_targeted_netem
    command:
    - bash
    - -lc
    - sudo -n /usr/local/sbin/etip-v2ray-netem apply
    timeout: 15
  - type: command
    name: perturbed_web
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11080
      --cacert encrypted_traffic_platform/config/certs/etip-ca.crt --http1.1 --fail --silent --show-error https://etip-server.lab:18443/web/
      -o /tmp/v2ray_perturbed_web.html
    timeout: 40
  - type: command
    name: perturbed_download_10m
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11080
      --cacert encrypted_traffic_platform/config/certs/etip-ca.crt --http1.1 --fail --silent --show-error --limit-rate 1M
      https://etip-server.lab:18443/files/file_10m.bin -o /tmp/v2ray_perturbed_10m.bin
    timeout: 90
  - type: command
    name: perturbed_download_50m
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11080
      --cacert encrypted_traffic_platform/config/certs/etip-ca.crt --http1.1 --fail --silent --show-error --limit-rate 2M
      https://etip-server.lab:18443/files/file_50m.bin -o /tmp/v2ray_perturbed_50m.bin
    timeout: 150
  - type: command
    name: perturbed_api
    command:
    - bash
    - -lc
    - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY curl --noproxy '' --proxy socks5h://127.0.0.1:11080
      --cacert encrypted_traffic_platform/config/certs/etip-ca.crt --http1.1 --fail --silent --show-error https://etip-server.lab:18443/cloud/index.json
      -o /tmp/v2ray_perturbed_api.json
    timeout: 40
  - type: sleep
    name: perturbed_post_idle
    seconds: 3
  finalize:
  - type: command
    name: clear_targeted_netem
    command:
    - bash
    - -lc
    - sudo -n /usr/local/sbin/etip-v2ray-netem clear
    timeout: 15
  - type: command
    name: stop_xray_client
    command:
    - bash
    - -lc
    - encrypted_traffic_platform/deployment/xray/stop_client.sh || true
    timeout: 30
  - type: marker
    name: finalize_v2ray_profile
